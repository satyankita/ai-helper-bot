<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Helper Bot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🤖 AI Helper Bot</h1>

        <p class="subtitle">
            Get a joke, motivation, or a helpful tip from AI.
        </p>

        <div class="buttons">

            <button id="jokeButton">
                😂 Get a Joke
            </button>

            <button id="motivationButton">
                💪 Get Motivation
            </button>

            <button id="tipButton">
                💡 Get Today's Tip
            </button>

        </div>

        <div class="response-card">

            <h2>AI Response</h2>

            <p id="response">
                Choose an option above to get started.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
